<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review Form</title>
    <meta name="description" content="Product review form for WDD 131 - Dynamic Web Fundamentals">
    <meta name="author" content="Osahon Okoro">
    <link rel="stylesheet" href="week05/style/style.css">
    <script src="week05/script/form.js" defer></script>
</head>

<body>
    <header>
        <div class="header-content">
            <h1>Product Review Form</h1>
        </div>
    </header>

    <main>
        <form action="review.html" method="get" id="review-form" class="review-form">
            <!-- Product Name - Required -->
            <div class="form-group">
                <label for="product-name">
                    Product Name <span class="required" aria-label="required">*</span>
                </label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>

            <!-- Overall Rating - Required -->
            <fieldset class="rating-fieldset">
                <legend>
                    Overall Rating <span class="required" aria-label="required">*</span>
                </legend>
                <div class="rating-options">
                    <label class="rating-label">
                        <input type="radio" name="rating" value="1" required>
                        <span class="stars">★☆☆☆☆</span>
                        <span class="rating-text">(1 Star)</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" name="rating" value="2">
                        <span class="stars">★★☆☆☆</span>
                        <span class="rating-text">(2 Stars)</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" name="rating" value="3">
                        <span class="stars">★★★☆☆</span>
                        <span class="rating-text">(3 Stars)</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" name="rating" value="4">
                        <span class="stars">★★★★☆</span>
                        <span class="rating-text">(4 Stars)</span>
                    </label>
                    <label class="rating-label">
                        <input type="radio" name="rating" value="5">
                        <span class="stars">★★★★★</span>
                        <span class="rating-text">(5 Stars)</span>
                    </label>
                </div>
            </fieldset>

            <!-- Date of Installation - Required -->
            <div class="form-group">
                <label for="install-date">
                    Date of Installation <span class="required" aria-label="required">*</span>
                </label>
                <input type="date" id="install-date" name="install-date" required>
            </div>

            <!-- Useful Features - Checkboxes -->
            <fieldset>
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="durability">
                        Durability
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="ease-of-use">
                        Ease of Use
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="performance">
                        Performance
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="design">
                        Design
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="value">
                        Value for Money
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="features" value="customer-support">
                        Customer Support
                    </label>
                </div>
            </fieldset>

            <!-- Written Review - Optional -->
            <div class="form-group">
                <label for="written-review">Written Review</label>
                <textarea id="written-review" name="written-review" rows="5"
                    placeholder="Share your experience with this product..."></textarea>
            </div>

            <!-- User Name - Optional -->
            <div class="form-group">
                <label for="user-name">Your Name (Optional)</label>
                <input type="text" id="user-name" name="user-name" placeholder="Enter your name">
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <button type="submit" class="submit-btn">Submit Review</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Osahon Okoro | Brigham Young University-Idaho</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
